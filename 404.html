<!doctype html>

<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Pàgina no trobada</title>
  <style>
    :root { color-scheme: light dark; --fons: #f6f7f9; --text: #1c2430; }
    @media (prefers-color-scheme: dark) { :root { --fons: #12161c; --text: #e8ecf1; } }
    body { margin: 0; padding: 2rem 16px; background: var(--fons); color: var(--text); font: 1.05rem/1.5 system-ui, sans-serif; }
  </style>
  <script>
    // Les adreces antigues de meteo-local (qualsevol pàgina de la carpeta) porten
    // a Temps a Montflorit; la resta d'adreces d'aquest lloc continuen sense trobar-se.
    if (/^\/meteo-local(\/|$)/.test(location.pathname)) location.replace('https://meteo-montflorit.github.io/');
  </script>
</head>
<body>
  <p>Pàgina no trobada · Página no encontrada</p>
</body>
</html>
